# Writes tomorrow's grammar lessons tonight, so none of them waits on the AI.
# See pinyin-immersion-app/tools/fill_bank.py.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL   the same Postgres URL the Streamlit app uses
#   GROQ_API_KEY   the same Groq key the Streamlit app uses
name: Fill the grammar drill bank

on:
  schedule:
    - cron: "0 18 * * *"        # 02:00 in Malaysia, before Groq's daily reset at 00:00 UTC
  workflow_dispatch:
    inputs:
      max_sets:
        description: "Most drill sets to write"
        default: "12"

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write drill sets
        working-directory: pinyin-immersion-app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tools/fill_bank.py "${{ github.event.inputs.max_sets || '12' }}"
