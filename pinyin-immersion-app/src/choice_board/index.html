<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Answer cards for the quiz games on the Play page (src/views/8_Games.py):
  picture -> word, word -> picture and listen -> picture.

  The prompt (a picture or a word; the listening game plays its audio above)
  sits over four option cards in a 2x2 grid. Tap a card to answer: it turns
  green if right, red if not, with the right card shown in green, and the
  board reports {sid, round, chosen} to Python, which scores the round, saves
  it and shows the word with its sound and a Next button.

  args: sid, round, prompt {kind: "image"|"word", img, zh, py} | null,
        options [{kind: "image"|"word", img, zh, py}], answer (index),
        answered (index or null - a restored round shows its answer),
        show_pinyin
-->
<style>
  :root {
    --face: #ffffff; --edge: #c5cae9; --edge-hover: #7986cb; --text: #263238;
    --muted: #78909c; --good: #2e7d32; --good-bg: #e8f5e9; --bad: #c62828; --bad-bg: #ffebee;
  }
  body.dark {
    --face: #262730; --edge: #3d4466; --edge-hover: #7986cb; --text: #fafafa;
    --muted: #9aa5b1; --good: #66bb6a; --good-bg: #1b3320; --bad: #ef5350; --bad-bg: #3a1c1c;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Source Sans Pro", "Noto Sans SC", "PingFang SC", sans-serif;
         color: var(--text); }
  #prompt { text-align: center; margin: 2px 0 12px; }
  #prompt:empty { display: none; }
  #prompt img { width: min(200px, 60vw); height: min(200px, 60vw); object-fit: contain;
                border-radius: 10px; }
  #prompt .zh { font-size: 2.6rem; line-height: 1.3; }
  #prompt .py { font-size: 1rem; color: var(--muted); }
  #grid { display: grid; grid-template-columns: repeat(2, minmax(0, 230px)); gap: 10px;
          justify-content: center; padding: 2px; }
  .card { position: relative; border: 2px solid var(--edge); border-radius: 12px;
          background: var(--face); color: inherit; font: inherit; cursor: pointer; padding: 8px;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          -webkit-tap-highlight-color: transparent; transition: border-color 0.15s, background 0.15s; }
  .card.image { aspect-ratio: 1 / 1; }
  .card.word { min-height: 76px; }
  .card img { width: 86%; height: 86%; object-fit: contain; border-radius: 8px; }
  .card .zh { font-size: clamp(1.3rem, 6vw, 1.8rem); line-height: 1.25; }
  .card .py { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
  @media (hover: hover) { .card:not(:disabled):hover { border-color: var(--edge-hover); } }
  .card:disabled { cursor: default; }
  .card.right { border-color: var(--good); background: var(--good-bg); }
  .card.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .card.faded { opacity: 0.45; }
  .card.right::after, .card.wrong::after { position: absolute; top: 4px; right: 8px; font-weight: 700; }
  .card.right::after { content: "✓"; color: var(--good); }
  .card.wrong::after { content: "✗"; color: var(--bad); }
</style>
</head>
<body>
<div id="prompt"></div>
<div id="grid" role="group" aria-label="Answers"></div>
<script>
"use strict";
// ---- Streamlit component protocol (same vanilla approach as hw_component) ----
function stMsg(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function stReady()      { stMsg("streamlit:componentReady", { apiVersion: 1 }); }
let lastHeight = -1;
function stHeight() {
  // the bottom of the content itself (never the frame's own height, which
  // would make the frame grow each time it's measured), sent only on change
  const h = Math.ceil(document.body.getBoundingClientRect().bottom + window.scrollY) + 6;
  if (h === lastHeight) return;
  lastHeight = h;
  stMsg("streamlit:setFrameHeight", { height: h });
}
function stValue(value) { stMsg("streamlit:setComponentValue", { dataType: "json", value: value }); }

let R = null;   // {sid, round, options, answer, chosen, showPinyin}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function content(x) {
  if (x.kind === "image") return `<img src="${x.img}" alt="">`;
  return `<div class="zh">${esc(x.zh)}</div>` + (R.showPinyin && x.py ? `<div class="py">${esc(x.py)}</div>` : "");
}

function build(prompt) {
  document.getElementById("prompt").innerHTML = prompt ? content(prompt) : "";
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  R.options.forEach((o, n) => {
    const b = document.createElement("button");
    b.className = `card ${o.kind}`;
    b.dataset.n = n;
    b.innerHTML = content(o);
    b.setAttribute("aria-label", o.kind === "word" ? o.zh : `Picture ${n + 1}`);
    b.addEventListener("click", () => choose(n));
    grid.appendChild(b);
  });
  document.querySelectorAll("img").forEach((i) => i.addEventListener("load", stHeight));
  paint();
}

function paint() {
  document.querySelectorAll(".card").forEach((b) => {
    const n = Number(b.dataset.n);
    const done = R.chosen !== null;
    b.disabled = done;
    b.classList.toggle("right", done && n === R.answer);
    b.classList.toggle("wrong", done && n === R.chosen && n !== R.answer);
    b.classList.toggle("faded", done && n !== R.answer && n !== R.chosen);
  });
  stHeight();
}

function choose(n) {
  if (!R || R.chosen !== null) return;
  R.chosen = n;
  paint();
  stValue({ sid: R.sid, round: R.round, chosen: n });
}

window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type !== "streamlit:render") return;
  const args = d.args || {};
  document.body.classList.toggle("dark", (d.theme || {}).base === "dark");
  if (R && R.sid === args.sid && R.round === args.round) {   // same round: keep what was tapped
    if (R.chosen === null && args.answered != null) { R.chosen = args.answered; paint(); }
    stHeight();
    return;
  }
  R = { sid: args.sid, round: args.round, options: args.options || [], answer: args.answer,
        chosen: args.answered == null ? null : args.answered, showPinyin: !!args.show_pinyin };
  build(args.prompt);
});

window.addEventListener("resize", stHeight);
// keep the frame as tall as the board whenever its layout changes (images
// arriving, the window narrowing), so the bottom row is never cut off
if (window.ResizeObserver) new ResizeObserver(() => stHeight()).observe(document.body);
stReady();
stHeight();
</script>
</body>
</html>
